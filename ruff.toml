line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]

[lint]
select = ["E", "F", "W", "B", "I"]
# E402: modules insert src/ into sys.path before importing project packages
ignore = ["E402"]

[lint.isort]
known-first-party = ["app", "main", "audio_analysis", "eye_tracking", "face_analysis", "fusion", "gemini"]
